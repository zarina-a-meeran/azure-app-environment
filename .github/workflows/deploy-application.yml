
name: Deploy Azure Application Environment

on:
  workflow_dispatch:
    inputs:
      environmentName:
        description: 'Enter environment name'
        required: true
        type: choice
        options:
          - dev
          - test

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Application Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Application
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: uksouth
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          template: ./parentModules/application/main.bicep
          parameters: ./input/${{ inputs.environmentName }}.application.params.json
